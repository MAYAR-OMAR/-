<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="bg-music" loop preload="auto">
        <source src="./الآية(74) من سورة الفرقان، بصوت القارئ الشيخ عبد الباسط عبد الصمد. [zUPOsZh-7lo].mp3" type="audio/mpeg">
    </audio>

    <!-- Envelope Intro Screen -->
    <div id="envelope-screen" class="envelope-screen" onclick="openInvitation()">
        <!-- 1. الفيديو المخفي -->
        <video id="envelope-video" class="env-video" muted playsinline preload="auto">
            <source src="./goldleaf-offwhite-open.mp4" type="video/mp4">
        </video>
        
        <!-- 2. الصورة الثابتة -->
        <img id="envelope-static" src="./photo6.jfif" class="env-bg" alt="Envelope Closed">
        
      
    </div>

    <!-- Hero Section -->
    <section class="hero-video-section">
        <!-- Background Video -->
        <video class="bg-video" autoplay loop muted playsinline>
            <source src="./Luxury_illustration_with_atmosph…_202605232035 (1).mp4" type="video/mp4">
        </video> <!-- إغلاق تاغ الفيديو هنا بشكل صحيح -->

        <!-- النصوص فوق الفيديو -->
        <div class="invitation-content">
            <h1 class="names">حسين <span class="and">&</span> حبيبة</h1>
            <p class="date">يوم الأحد، ٦ سبتمبر ٢٠٢٦</p>
            <p class="time">الساعة التاسعه مساءً</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
